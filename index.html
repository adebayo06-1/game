<!DOCTYPE html>
<html>
<head>
<title>Mobile Chaos Boss</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{
margin:0;
overflow:hidden;
background:#000;
touch-action:none;
font-family:Arial;
}

canvas{display:block;}

#scoreBoard{
position:absolute;
top:10px;
left:10px;
color:white;
}

#menu{
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
}

#gameOver{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
display:none;
text-align:center;
}

button{
padding:12px 20px;
margin:5px;
font-size:16px;
}
</style>
</head>

<body>

<div id="menu">
<h2>Chaos Survival</h2>
<button onclick="startGame('easy')">Easy</button>
<button onclick="startGame('medium')">Medium</button>
<button onclick="startGame('hard')">Hard</button>
<button onclick="startGame('impossible')">Impossible 💀</button>
</div>

<div id="scoreBoard">Score: 0</div>
<div id="gameOver">Game Over 💀<br><button onclick="location.reload()">Restart</button></div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let w,h;
function resize(){
w=canvas.width=innerWidth;
h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

// GAME STATE
let score=0;
let enemies=[];
let particles=[];
let boss=null;
let bossActive=false;
let bossTimer=0;
let running=true;
let lastSpawn=0;
let chaos=1;
let difficulty="medium";

let settings={
spawnRate:800,
enemySpeed:2,
bossTime:800
};

const player={
x:w/2,
y:h/2,
size:16
};

// TOUCH CONTROLS (SMOOTH)
function movePlayer(x,y){
player.x = x;
player.y = y;
}

canvas.addEventListener("touchstart",e=>{
e.preventDefault();
movePlayer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});

canvas.addEventListener("touchmove",e=>{
e.preventDefault();
movePlayer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});

canvas.addEventListener("mousemove",e=>{
movePlayer(e.clientX,e.clientY);
});

// DIFFICULTY
function setDifficulty(mode){
difficulty=mode;

if(mode==="easy"){
settings.spawnRate=1000;
settings.enemySpeed=1.5;
settings.bossTime=1200;
}

if(mode==="medium"){
settings.spawnRate=800;
settings.enemySpeed=2;
settings.bossTime=800;
}

if(mode==="hard"){
settings.spawnRate=500;
settings.enemySpeed=3;
settings.bossTime=500;
}

if(mode==="impossible"){
settings.spawnRate=300;
settings.enemySpeed=4;
settings.bossTime=300;
}
}

function startGame(mode){
setDifficulty(mode);
document.getElementById("menu").style.display="none";
}

// ENEMY
class Enemy{
constructor(){
this.x=Math.random()*w;
this.y=Math.random()*h;
this.size=12;
this.speed=settings.enemySpeed + chaos*0.3;
}

update(){
let dx=player.x-this.x;
let dy=player.y-this.y;
let d=Math.hypot(dx,dy);

this.x+=dx/d*this.speed;
this.y+=dy/d*this.speed;
}

draw(){
ctx.fillStyle="red";
ctx.fillRect(this.x,this.y,this.size,this.size);
}
}

// PARTICLES (LIGHTWEIGHT)
class Particle{
constructor(x,y){
this.x=x;
this.y=y;
this.vx=(Math.random()-0.5)*4;
this.vy=(Math.random()-0.5)*4;
this.life=15;
}

update(){
this.x+=this.vx;
this.y+=this.vy;
this.life--;
}

draw(){
ctx.fillStyle="orange";
ctx.fillRect(this.x,this.y,2,2);
}
}

// BOSS (OPTIMIZED)
class Boss{
constructor(){
this.x=w/2;
this.y=h/2;
this.size=60;
this.speed=1.5;
}

update(){
let dx=player.x-this.x;
let dy=player.y-this.y;
let d=Math.hypot(dx,dy);

// light gravity pull (not too strong for mobile)
player.x -= dx * 0.0015;
player.y -= dy * 0.0015;

this.x += dx/d * this.speed;
this.y += dy/d * this.speed;

// controlled spawning
if(Math.random()<0.02){
enemies.push(new Enemy());
}

// small particle burst
if(Math.random()<0.02){
particles.push(new Particle(this.x,this.y));
}
}

draw(){
ctx.fillStyle="purple";
ctx.fillRect(this.x,this.y,this.size,this.size);
}
}

// GAME LOOP
function loop(time){
if(!running) return;

ctx.fillStyle="rgba(0,0,0,0.3)";
ctx.fillRect(0,0,w,h);

// PLAYER
ctx.fillStyle="lime";
ctx.fillRect(player.x,player.y,player.size,player.size);

// CHAOS SCALE (controlled)
chaos += 0.001;

// SPAWN ENEMIES
if(time-lastSpawn>settings.spawnRate){
enemies.push(new Enemy());
score++;
document.getElementById("scoreBoard").innerText="Score: "+score;
lastSpawn=time;
}

// BOSS SPAWN
bossTimer++;
if(!bossActive && bossTimer>settings.bossTime){
boss=new Boss();
bossActive=true;
}

// ENEMIES
enemies.forEach(e=>{
e.update();
e.draw();

let d=Math.hypot(player.x-e.x,player.y-e.y);
if(d<20){
running=false;
document.getElementById("gameOver").style.display="block";
}
});

// BOSS
if(bossActive && boss){
boss.update();
boss.draw();

let d=Math.hypot(player.x-boss.x,player.y-boss.y);
if(d<50){
running=false;
document.getElementById("gameOver").style.display="block";
}
}

// PARTICLES
particles.forEach((p,i)=>{
p.update();
p.draw();
if(p.life<=0)particles.splice(i,1);
});

requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
